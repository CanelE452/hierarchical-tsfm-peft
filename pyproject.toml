[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hierarchical-tsfm-peft"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch>=2.2,<3", "chronos-forecasting[extras]", "peft", "transformers>=4.41,<6",
  "accelerate", "datasetsforecast==1.0.1", "hierarchicalforecast==1.5.1",
  "statsforecast", "utilsforecast", "pandas", "numpy", "scipy", "scikit-learn",
  "pyarrow", "matplotlib", "pyyaml", "psutil", "pytest", "tqdm", "safetensors"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
