    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(41.875425 85.081344)">Past X</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(36.5873 94.682906)">512 x 17</text>
   </g>
   <g id="text_2">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(149.488925 80.280875)">Fixed E</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(142.471425 89.882438)">TRAIN PCA</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(148.6808 99.484)">17 -&gt; 5</text>
   </g>
   <g id="text_3">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(263.238475 85.081031)">Frozen F0</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(253.835975 94.683219)">5 latent series</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(386.558025 85.081656)">Fixed D</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(386.3024 94.683219)">5 -&gt; 17</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(550.059075 85.081031)">Forecast</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(540.0447 94.683219)">b + level + G</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle" x="477.8766" y="80.93088" transform="rotate(-0 477.8766 80.93088)">b</text>
   </g>
   <g id="text_7">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(144.178725 183.882131)">r = X - D(E(X))</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(147.57685 193.484319)">Past residual</text>
   </g>
   <g id="text_8">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(270.92745 167.845164)">Subtract last(r)</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(271.144325 177.447351)">Detached level</text>
   </g>
   <g id="text_9">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(402.5877 167.845476)">Train G only</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(393.7977 177.447039)">512 -&gt; 32 -&gt; 48</text>
   </g>
   <g id="text_10">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #8b3f6e" x="387.2052" y="208.0836" transform="rotate(-0 387.2052 208.0836)">Repeat last(r) for 48 steps</text>
   </g>
   <g id="text_11">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(203.636875 248.297995)">Matched RAW: same residual level; G receives X - last(X).</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(197.919375 260.68237)">OLD_RES: b + G(r).  LEVEL_ONLY: b + last(r).  COMPRESS: b.</text>
   </g>
  </g>
  <g id="text_12">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle" x="316.8" y="14.118281" transform="rotate(-0 316.8 14.118281)">Fixed LEVEL Residual Adapter and Matched Controls</text>
  </g>
  <g id="text_13">
   <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(140.3575 291.08725)">Robin: C = 17, K = 5; frozen PCA and Chronos-Bolt-small; 17,920 learned G parameters.</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(124.064375 302.976)">G is shared, bias-free and linear; zero output initialization starts at LEVEL_ONLY, not COMPRESS.</text>
  </g>
